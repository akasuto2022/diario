<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi diario</title>
<meta name="theme-color" content="#ffd1e3">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(160deg,#ffe3ef,#ffd1e3 55%,#ffc2dc);--card:#fff;--ink:#5a2a45;--soft:#fff0f6;--acc:#ff6fa5;--acc2:#ff9bc4;--mut:#b37a97;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
[data-tema=lavanda]{--bg:linear-gradient(160deg,#ece3ff,#ddd0ff 55%,#cfc0ff);--ink:#40306b;--soft:#f5f0ff;--acc:#9b7bff;--acc2:#c0a9ff;--mut:#8a7bb8}
[data-tema=menta]{--bg:linear-gradient(160deg,#dcf8ee,#c6f1e1 55%,#b2ead6);--ink:#1f5a49;--soft:#ecfbf5;--acc:#2fc29a;--acc2:#7fe0c3;--mut:#5f9a88}
[data-tema=durazno]{--bg:linear-gradient(160deg,#ffeadb,#ffdcc4 55%,#ffcdae);--ink:#6b3a22;--soft:#fff4ec;--acc:#ff8a5c;--acc2:#ffb08c;--mut:#b08068}
[data-tema=noche]{--bg:linear-gradient(160deg,#1f1b3a,#2a2250 55%,#362a63);--card:#3a3068;--ink:#f1e9ff;--soft:#2e2658;--acc:#ff8fd0;--acc2:#b79bff;--mut:#b6a8e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#ffd1e3}
body{font-family:'Quicksand',system-ui,sans-serif;background:var(--bg) fixed;color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
h1{font-family:'Pacifico','Brush Script MT',cursive;font-weight:400;font-size:30px;margin:18px 18px 4px;color:var(--acc)}
.sub{margin:0 18px 12px;color:var(--mut);font-size:14px}
main{padding:0 14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:14px;margin:0 0 12px;box-shadow:0 8px 20px #0000001a}
input,textarea,select{width:100%;border:2px solid var(--acc2);background:var(--soft);color:var(--ink);border-radius:14px;padding:11px 12px;font:inherit;font-size:16px;margin-bottom:8px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.fila{display:flex;gap:8px}.fila>*{flex:1;min-width:0}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:12px 16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:16px;box-shadow:0 5px 12px #0003}
button:active{transform:scale(.95)}
.sec{display:none}.sec.on{display:block;animation:ent .35s}
@keyframes ent{from{opacity:0;transform:translateY(10px)}}
.dia{font-weight:700;color:var(--acc);margin:14px 6px 6px;text-transform:capitalize}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:11px 12px;margin-bottom:8px;box-shadow:0 4px 12px #0000001a}
.item.ok .t{text-decoration:line-through;opacity:.5}
.item .t{flex:1;min-width:0;word-break:break-word}.item small{color:var(--mut);display:block}
.chk{width:30px;height:30px;padding:0;border-radius:50%;background:var(--soft);color:var(--acc);box-shadow:none;border:2px solid var(--acc2);flex:none}
.del{background:none;color:var(--mut);box-shadow:none;padding:6px 8px;font-size:18px}
.notas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nota{border-radius:20px;padding:12px;color:#4a2a3a;box-shadow:0 6px 14px #0002;word-break:break-word;position:relative;min-height:90px}
.nota b{display:block;margin-bottom:4px}.nota p{margin:0;font-size:14px;white-space:pre-wrap}
.nota .del{position:absolute;top:2px;right:2px;color:#4a2a3a99}
.cols{display:flex;gap:10px;margin:2px 0 10px}
.dot{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent;box-shadow:0 2px 6px #0003}
.dot.sel{border-color:var(--ink)}
.estilos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est{padding:0;overflow:hidden;background:var(--card);color:var(--ink);text-align:left;border:3px solid transparent}
.est.sel{border-color:var(--acc)}
.est i{display:block;height:54px}.est span{display:block;padding:8px 10px;font-size:15px}
.vacio{text-align:center;color:var(--mut);padding:24px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;box-shadow:0 -6px 20px #0002;z-index:5}
nav button{background:none;color:var(--mut);box-shadow:none;font-size:13px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:22px}nav button.on{color:var(--acc)}
.fx{position:fixed;pointer-events:none;z-index:99;font-size:20px;animation:vuela .8s ease-out forwards}
@keyframes vuela{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(120deg);opacity:0}}
.rip{position:fixed;pointer-events:none;z-index:98;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:3px solid var(--acc);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(7);opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--card);color:var(--ink);padding:12px 18px;border-radius:18px;box-shadow:0 8px 24px #0004;z-index:120;max-width:90%;font-weight:700}
</style>
</head>
<body>
<h1>Mi diario</h1>
<p class="sub" id="saludo">Tus planes y tus notas, con cariño ✨</p>
<main>
<section class="sec on" id="s-agenda">
 <div class="card">
  <input id="a-t" placeholder="¿Qué vas a hacer?" maxlength="80">
  <div class="fila"><input id="a-d" type="date"><input id="a-h" type="time"></div>
  <select id="a-v"><option value="0">🔔 Avisar a la hora</option><option value="10">🔔 10 minutos antes</option><option value="60">🔔 1 hora antes</option><option value="1440">🔔 1 día antes</option></select>
  <button id="a-ok" style="width:100%">Agregar a la agenda 💖</button>
 </div>
 <div id="l-agenda"></div>
</section>
<section class="sec" id="s-notas">
 <div class="card">
  <input id="n-t" placeholder="Título de la nota" maxlength="40">
  <textarea id="n-x" placeholder="Escribe aquí tus ideas, secretos o pendientes…"></textarea>
  <div class="cols" id="n-c"></div>
  <div class="fila"><button id="n-ok">Guardar nota 🌸</button><button id="n-no" style="display:none;background:var(--soft);color:var(--acc)">Cancelar</button></div>
 </div>
 <div class="notas" id="l-notas"></div>
</section>
<section class="sec" id="s-estilos">
 <p class="sub" style="margin:0 6px 10px">Elige el estilo que más te guste:</p>
 <div class="estilos" id="l-est"></div>
</section>
</main>
<nav id="nav">
 <button data-s="agenda" class="on"><b>📅</b>Agenda</button>
 <button data-s="notas"><b>📝</b>Notas</button>
 <button data-s="estilos"><b>🎨</b>Estilos</button>
</nav>
<script>
const K='mi-diario-v1';
const TEMAS={rosa:['Rosa dulce','#ff9bc4','🌸💖✨🎀🌷'],lavanda:['Lavanda','#c0a9ff','💜🦋✨🔮🌙'],menta:['Menta fresca','#7fe0c3','🍃💚✨🌿🫧'],durazno:['Durazno','#ffb08c','🍑🧡✨🌼🦄'],noche:['Noche de estrellas','#362a63','⭐🌙✨💫🔮']};
const COLS=['#ffd6e7','#e4d6ff','#d3f5e6','#ffe3cf','#fff5c2'];
let S={tema:null,notas:[],citas:[]},sel=COLS[0],edit=null,ref=null,tm=null;
const $=i=>document.getElementById(i);
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function h(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function cargar(){try{const x=JSON.parse(localStorage.getItem(K));if(x)S=Object.assign(S,x)}catch(e){}}
function guardar(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(sincronizar,500)}
function tema0(){return matchMedia('(prefers-color-scheme: dark)').matches?'noche':'rosa'}
function aplicarTema(t){if(!TEMAS[t])t='rosa';S.tema=t;document.documentElement.dataset.tema=t;document.documentElement.style.background=TEMAS[t][1]}
/* efectos al tocar */
document.addEventListener('pointerdown',e=>{const em=[...(TEMAS[S.tema]||TEMAS.rosa)[2]].filter(c=>c.trim());
 const r=h('div','rip');r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),650);
 for(let i=0;i<6;i++){const f=h('span','fx',em[Math.floor(Math.random()*em.length)]);const a=Math.random()*6.28,d=40+Math.random()*50;
  f.style.left=e.clientX-10+'px';f.style.top=e.clientY-10+'px';f.style.setProperty('--dx',Math.cos(a)*d+'px');f.style.setProperty('--dy',Math.sin(a)*d-20+'px');
  document.body.appendChild(f);setTimeout(()=>f.remove(),850)}
 if(navigator.vibrate)try{navigator.vibrate(8)}catch(x){}},{passive:true});
/* navegación */
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.s))});
/* agenda */
function etiqueta(d){const t=hoy(),m=new Date();m.setDate(m.getDate()+1);
 const ms=m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0');
 if(d===t)return'Hoy';if(d===ms)return'Mañana';if(!d)return'Sin fecha';
 return new Date(d+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}
$('a-ok').onclick=()=>{const t=$('a-t').value.trim();if(!t){$('a-t').focus();return}
 S.citas.push({id:Date.now(),t,d:$('a-d').value||hoy(),h:$('a-h').value,av:+$('a-v').value||0,ok:false});$('a-t').value='';$('a-h').value='';guardar();pintar();permiso()};
function pAgenda(){const l=$('l-agenda');l.textContent='';
 if(!S.citas.length){l.appendChild(h('div','vacio','Aún no hay planes. ¡Agrega el primero! 🌷'));return}
 const o=[...S.citas].sort((a,b)=>(a.d+(a.h||'99')).localeCompare(b.d+(b.h||'99')));let ult=null;
 o.forEach(c=>{if(c.d!==ult){l.appendChild(h('div','dia',etiqueta(c.d)));ult=c.d}
  const it=h('div','item'+(c.ok?' ok':'')),ck=h('button','chk',c.ok?'✓':''),tx=h('div','t'),dl=h('button','del','✕');
  tx.appendChild(document.createTextNode(c.t));if(c.h)tx.appendChild(h('small','',c.h));
  ck.onclick=()=>{c.ok=!c.ok;guardar();pintar()};dl.onclick=()=>{S.citas=S.citas.filter(x=>x.id!==c.id);guardar();pintar()};
  it.append(ck,tx,dl);l.appendChild(it)})}
/* notas */
function pColores(){const c=$('n-c');c.textContent='';COLS.forEach(k=>{const b=h('button','dot'+(k===sel?' sel':''));b.style.background=k;b.onclick=()=>{sel=k;pColores()};c.appendChild(b)})}
function limpiar(){edit=null;$('n-t').value='';$('n-x').value='';$('n-no').style.display='none';$('n-ok').textContent='Guardar nota 🌸'}
$('n-no').onclick=limpiar;
$('n-ok').onclick=()=>{const t=$('n-t').value.trim(),x=$('n-x').value.trim();if(!t&&!x){$('n-x').focus();return}
 if(edit){const n=S.notas.find(n=>n.id===edit);if(n){n.t=t;n.x=x;n.c=sel}}else S.notas.unshift({id:Date.now(),t,x,c:sel});
 limpiar();guardar();pintar()};
function pNotas(){const l=$('l-notas');l.textContent='';
 if(!S.notas.length){const v=h('div','vacio','Tus notas aparecerán aquí 💌');v.style.gridColumn='1/3';l.appendChild(v);return}
 S.notas.forEach(n=>{const c=h('div','nota');c.style.background=n.c;if(n.t)c.appendChild(h('b','',n.t));c.appendChild(h('p','',n.x));
  const d=h('button','del','✕');d.onclick=e=>{e.stopPropagation();S.notas=S.notas.filter(k=>k.id!==n.id);if(edit===n.id)limpiar();guardar();pintar()};
  c.onclick=()=>{edit=n.id;$('n-t').value=n.t;$('n-x').value=n.x;sel=n.c;pColores();$('n-no').style.display='';$('n-ok').textContent='Actualizar nota 💕';scrollTo({top:0,behavior:'smooth'})};
  c.appendChild(d);l.appendChild(c)})}
/* estilos */
function pEstilos(){const l=$('l-est');l.textContent='';
 Object.entries(TEMAS).forEach(([k,v])=>{const b=h('button','est'+(S.tema===k?' sel':''));const i=h('i');i.style.background='linear-gradient(135deg,'+v[1]+',#fff8)';
  if(k==='noche')i.style.background='linear-gradient(135deg,#1f1b3a,#ff8fd0)';
  b.append(i,h('span','',v[2].slice(0,2)+' '+v[0]));b.onclick=()=>{aplicarTema(k);guardar();pintar()};l.appendChild(b)})}
function pintar(){pAgenda();pNotas();pEstilos();pColores();const hr=new Date().getHours();
 $('saludo').textContent=(hr<12?'Buenos días':hr<19?'Buenas tardes':'Buenas noches')+', preciosa. Tus planes y notas, con cariño ✨'}

/* avisos: en la app de Android usan notificaciones del sistema; en el navegador, mientras esté abierta */
const NL=(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?Capacitor.Plugins.LocalNotifications:null;
const idNum=id=>Math.abs(Number(id)%2147483000)+1;
function cuando(c){const [y,m,d]=c.d.split('-').map(Number),[hh,mm]=(c.h||'09:00').split(':').map(Number);return new Date(y,m-1,d,hh,mm-(c.av||0))}
function textoAviso(c){return (c.av?'Pronto: ':'')+c.t+(c.h?' · '+c.h:'')}
function aviso(txt){const t=h('div','',txt);t.id='toast';document.body.appendChild(t);setTimeout(()=>t.remove(),5000)}
async function permiso(){try{
 if(NL){let p=await NL.checkPermissions();if(p.display!=='granted')p=await NL.requestPermissions();return p.display==='granted'}
 if('Notification' in window){if(Notification.permission==='default')await Notification.requestPermission();return Notification.permission==='granted'}
}catch(e){}return false}
async function sincronizar(){if(!NL)return;try{
 const p=await NL.getPending();if(p.notifications.length)await NL.cancel({notifications:p.notifications.map(n=>({id:n.id}))});
 const ya=Date.now(),l=S.citas.filter(c=>!c.ok).map(c=>({c,at:cuando(c)})).filter(x=>x.at.getTime()>ya).slice(0,60)
  .map(({c,at})=>({id:idNum(c.id),title:'Mi diario 🌸',body:textoAviso(c),schedule:{at,allowWhileIdle:true},smallIcon:'ic_stat_icon',iconColor:'#FF6FA5'}));
 if(l.length)await NL.schedule({notifications:l})}catch(e){}}
function revisar(){if(NL)return;const ya=Date.now();let cambio=false;
 S.citas.forEach(c=>{if(c.ok||c.avisada)return;const t=cuando(c).getTime();if(t<=ya&&ya-t<600000){c.avisada=true;cambio=true;
  aviso('🔔 '+textoAviso(c));try{if('Notification' in window&&Notification.permission==='granted')new Notification('Mi diario 🌸',{body:textoAviso(c)})}catch(e){}}});
 if(cambio)guardar()}
cargar();aplicarTema(S.tema||tema0());$('a-d').value=hoy();pintar();sincronizar();setInterval(revisar,15000);
</script>
</body>
</html>
